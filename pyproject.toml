[project]
name = "dronemap"
version = "0.1.0"
description = "Single-pass drone video to georeferenced, metrically accurate textured 3D model"
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
    # --- core numerics / imaging ---
    "numpy>=1.26,<2.3",
    "scipy>=1.11",
    "opencv-python>=4.10",
    "pillow>=10.0",
    "matplotlib>=3.8",
    "imageio-ffmpeg>=0.5",       # bundles a static ffmpeg binary (no admin install needed)
    # --- CLI / config ---
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "requests>=2.32",
    # --- geospatial ---
    "pyproj>=3.6",
    "pymap3d>=3.1",
    "rasterio>=1.3",
    "laspy[lazrs]>=2.5",
    "piexif>=1.1.3",
    # --- 3D / meshes ---
    "trimesh>=4.4",
    "pygltflib>=1.16",
    # --- pose accuracy ---
    "evo>=1.29",
    # --- web ---
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Heavy ML stack. Needed from WP3 (dynamic masking) onward.
#   uv sync --extra ml
ml = [
    "torch>=2.5",
    "torchvision>=0.20",
    "ultralytics>=8.3",
    "transformers>=4.44",
]
# Extra 3D tooling. open3d/pycolmap have no cp314 wheels, which is why we pin 3.11.
#   uv sync --extra geo3d
geo3d = [
    "open3d>=0.18",
    "pymeshlab>=2023.12",
    "pycolmap>=3.10",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
dronemap = "dronemap.cli:app"

# ---------------------------------------------------------------------------
# torch must come from the PyTorch CUDA index, not PyPI (PyPI ships CPU-only
# wheels on Windows). Driver here reports CUDA UMD 13.4, so cu128 is safe.
# Verified available: torch-2.9.1+cu128-cp311-cp311-win_amd64
# ---------------------------------------------------------------------------
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dronemap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: end-to-end reconstruction test (slow; needs COLMAP + OpenMVS + Blender)",
    "needs_gpu: requires a working CUDA device",
]
